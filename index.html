<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>یادآور | مینی‌اپ یادآوری‌ها</title>
<meta name="description" content="یادآور، مینی‌اپ تلگرام برای ثبت و مدیریت یادآوری‌های روزانه با تکرار، اولویت و آمار لحظه‌ای." />
<meta name="theme-color" content="#0b0b16" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0a0a14; --bg2:#12102a;
  --glass:rgba(255,255,255,.06);
  --glass-brd:rgba(255,255,255,.12);
  --txt:#f2f3fb; --muted:#a5a7c4;
  --p1:#7c5cff; --p2:#3aa0ff; --ok:#2fd39a; --warn:#ffb020; --bad:#ff5d6c;
  --shadow:0 18px 40px -18px rgba(0,0,0,.75);
  --r:22px;
}
html[data-theme="light"]{
  --bg:#f4f5fb; --bg2:#e9e9ff;
  --glass:rgba(255,255,255,.72);
  --glass-brd:rgba(20,20,60,.09);
  --txt:#161734; --muted:#5d6084;
  --shadow:0 18px 40px -22px rgba(40,40,90,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{
  font-family:Vazirmatn,system-ui,sans-serif;
  background:
    radial-gradient(900px 500px at 85% -10%,rgba(124,92,255,.35),transparent 60%),
    radial-gradient(700px 500px at 0% 10%,rgba(58,160,255,.28),transparent 60%),
    linear-gradient(180deg,var(--bg),var(--bg2));
  background-attachment:fixed;
  color:var(--txt); min-height:100vh;
  padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 120px);
  transition:background .35s ease,color .25s ease;
}
.glass{background:var(--glass);border:1px solid var(--glass-brd);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow);border-radius:var(--r)}
.wrap{max-width:520px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.logo{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-size:22px;background:linear-gradient(140deg,var(--p1),var(--p2));box-shadow:0 10px 24px -10px var(--p1)}
h1{font-size:19px;margin:0;font-weight:800}
.sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.hbtns{margin-inline-start:auto;display:flex;gap:8px}
.icon-btn{width:44px;height:44px;border-radius:14px;border:1px solid var(--glass-brd);background:var(--glass);color:var(--txt);font-size:17px;cursor:pointer;transition:transform .15s,background .2s}
.icon-btn:active{transform:scale(.92)}
.hero{padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.hero h2{margin:0 0 6px;font-size:17px}
.hero p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.9}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{padding:14px 8px;text-align:center}
.stat b{display:block;font-size:22px;background:linear-gradient(120deg,var(--p1),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:11px;color:var(--muted)}
.rowhead{display:flex;align-items:center;justify-content:space-between;margin:0 4px 10px}
.rowhead h3{font-size:14.5px;margin:0}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:9px 16px;min-height:40px;border-radius:999px;border:1px solid var(--glass-brd);background:var(--glass);color:var(--muted);font:inherit;font-size:12.5px;cursor:pointer;transition:.2s}
.chip.on{color:#fff;background:linear-gradient(120deg,var(--p1),var(--p2));border-color:transparent}
.list{display:flex;flex-direction:column;gap:12px}
.card{padding:15px;animation:in .32s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.card .top{display:flex;align-items:flex-start;gap:10px}
.card h4{margin:0;font-size:14.5px;flex:1;line-height:1.7}
.card.done h4{text-decoration:line-through;opacity:.55}
.desc{margin:8px 0 0;font-size:12px;color:var(--muted);line-height:1.9}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.tag{font-size:11px;padding:5px 10px;border-radius:10px;background:rgba(125,125,190,.14);color:var(--muted)}
.pri{font-size:10.5px;padding:5px 10px;border-radius:10px;font-weight:700}
.pri.normal{background:rgba(58,160,255,.16);color:#5ab0ff}
.pri.high{background:rgba(255,176,32,.16);color:#ffb020}
.pri.urgent{background:rgba(255,93,108,.16);color:#ff7683}
.acts{display:flex;gap:8px;margin-top:13px}
.btn{flex:1;min-height:44px;border-radius:14px;border:1px solid var(--glass-brd);background:var(--glass);color:var(--txt);font:inherit;font-size:12.5px;cursor:pointer;transition:transform .14s,opacity .2s}
.btn:active{transform:scale(.96)}
.btn.prim{border:none;color:#fff;background:linear-gradient(120deg,var(--p1),var(--p2));box-shadow:0 12px 26px -14px var(--p1)}
.btn.ok{border:none;color:#04241a;background:linear-gradient(120deg,#48e2ae,var(--ok))}
.btn.danger{color:var(--bad)}
.card.attention{border-color:rgba(255,176,32,.5);background:linear-gradient(150deg,rgba(255,176,32,.14),var(--glass));animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(255,176,32,.10)}}
.attn-bar{font-size:12px;font-weight:700;color:var(--warn);margin-bottom:10px}
.empty{text-align:center;padding:44px 20px}
.empty .e{font-size:40px}
.empty p{color:var(--muted);font-size:12.5px;margin:10px 0 0;line-height:2}
.fab{position:fixed;inset-inline:0;bottom:calc(env(safe-area-inset-bottom) + 16px);margin:0 auto;width:min(488px,calc(100% - 32px));min-height:56px;border:none;border-radius:20px;color:#fff;font:inherit;font-size:15px;font-weight:700;cursor:pointer;background:linear-gradient(120deg,var(--p1),var(--p2));box-shadow:0 18px 40px -14px var(--p1);transition:transform .16s;z-index:40}
.fab:active{transform:scale(.97)}
.ov{position:fixed;inset:0;background:rgba(4,4,14,.6);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:.25s;z-index:60}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:70;transform:translateY(101%);transition:transform .34s cubic-bezier(.22,1,.36,1);max-height:92vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 20px);background:var(--glass);border:1px solid var(--glass-brd);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
html[data-theme="dark"] .sheet{background:rgba(18,16,42,.92)}
html[data-theme="light"] .sheet{background:rgba(255,255,255,.96)}
.sheet.on{transform:translateY(0)}
.grab{width:44px;height:4px;border-radius:9px;background:var(--glass-brd);margin:6px auto 14px}
.sheet h3{margin:0 0 14px;font-size:16px}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
.f{margin-bottom:13px}
input,textarea,select{width:100%;min-height:46px;padding:11px 13px;border-radius:14px;border:1px solid var(--glass-brd);background:rgba(125,125,190,.10);color:var(--txt);font:inherit;font-size:13px;outline:none;transition:border .2s}
textarea{min-height:74px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--p1)}
select option{color:#111}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--bad);font-size:11px;margin-top:5px;display:none}
.err.on{display:block}
.snooze{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 14px);inset-inline:0;margin:0 auto;width:max-content;max-width:88%;padding:12px 18px;border-radius:16px;font-size:12.5px;color:#fff;z-index:90;opacity:0;transform:translateY(-16px);transition:.28s;pointer-events:none}
.toast.on{opacity:1;transform:translateY(0)}
.toast.s{background:linear-gradient(120deg,#25b98a,var(--ok))}
.toast.e{background:linear-gradient(120deg,#e0455a,var(--bad))}
.toast.i{background:linear-gradient(120deg,var(--p1),var(--p2))}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">⏰</div>
    <div>
      <h1>یادآور</h1>
      <div class="sub">هیچ کاری را دیگر فراموش نکن</div>
    </div>
    <div class="hbtns">
      <button class="icon-btn" id="themeBtn" aria-label="تغییر پوسته">🌙</button>
      <button class="icon-btn" id="settingsBtn" aria-label="تنظیمات">⚙️</button>
    </div>
  </header>

  <section class="glass hero">
    <h2 id="hello">سلام 👋</h2>
    <p id="heroSub">یادآوری‌های امروزت اینجاست.</p>
  </section>

  <section class="stats">
    <div class="glass stat"><b id="sToday">۰</b><span>امروز</span></div>
    <div class="glass stat"><b id="sPending">۰</b><span>در انتظار</span></div>
    <div class="glass stat"><b id="sDone">۰</b><span>انجام‌شده</span></div>
  </section>

  <div class="rowhead"><h3>یادآوری‌های نزدیک</h3><span class="sub" id="count"></span></div>

  <div class="filters" id="filters">
    <button class="chip on" data-f="all">همه</button>
    <button class="chip" data-f="today">امروز</button>
    <button class="chip" data-f="active">فعال</button>
    <button class="chip" data-f="completed">انجام‌شده</button>
  </div>

  <div class="list" id="list"></div>
</div>

<button class="fab" id="fab">＋ یادآوری جدید</button>

<div class="ov" id="ov"></div>

<!-- form sheet -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <h3 id="sheetTitle">یادآوری جدید</h3>
  <form id="form" novalidate>
    <div class="f"><label for="title">عنوان</label><input id="title" maxlength="80" placeholder="مثلاً تماس با مشتری" /><div class="err" id="eTitle">عنوان را وارد کنید.</div></div>
    <div class="f"><label for="desc">توضیحات (اختیاری)</label><textarea id="desc" maxlength="300" placeholder="جزئیات بیشتر…"></textarea></div>
    <div class="two">
      <div class="f"><label for="date">تاریخ</label><input id="date" type="date" /><div class="err" id="eDate">تاریخ معتبر نیست.</div></div>
      <div class="f"><label for="time">ساعت</label><input id="time" type="time" /><div class="err" id="eTime">ساعت معتبر نیست.</div></div>
    </div>
    <div class="err" id="ePast" style="margin:-6px 0 12px">زمان انتخاب‌شده گذشته است.</div>
    <div class="two">
      <div class="f"><label for="repeat">تکرار</label>
        <select id="repeat">
          <option value="none">بدون تکرار</option><option value="daily">هر روز</option>
          <option value="weekly">هر هفته</option><option value="monthly">هر ماه</option><option value="yearly">هر سال</option>
        </select></div>
      <div class="f"><label for="priority">اولویت</label>
        <select id="priority"><option value="normal">عادی</option><option value="high">مهم</option><option value="urgent">خیلی مهم</option></select></div>
    </div>
    <div class="acts" style="margin-top:4px">
      <button type="button" class="btn" id="cancelBtn">انصراف</button>
      <button type="submit" class="btn prim">ذخیره یادآوری</button>
    </div>
  </form>
</div>

<!-- snooze sheet -->
<div class="sheet" id="snoozeSheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <h3>یادآوری برای چه زمانی؟</h3>
  <div class="snooze">
    <button class="btn" data-sn="10">۱۰ دقیقه</button>
    <button class="btn" data-sn="30">۳۰ دقیقه</button>
    <button class="btn" data-sn="60">۱ ساعت</button>
    <button class="btn" data-sn="tomorrow">فردا</button>
  </div>
  <button class="btn" id="snCancel">انصراف</button>
</div>

<!-- confirm sheet -->
<div class="sheet" id="confirmSheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <h3>حذف یادآوری</h3>
  <p class="desc" id="confirmText">مطمئنی می‌خواهی این یادآوری حذف شود؟</p>
  <div class="acts" style="margin-top:16px">
    <button class="btn" id="cfNo">انصراف</button>
    <button class="btn danger" id="cfYes">بله، حذف کن</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  /* ---------- Telegram bridge (safe on plain browsers) ---------- */
  var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  function haptic(type, kind) {
    try {
      if (!tg || !tg.HapticFeedback) return;
      if (type === "notification") tg.HapticFeedback.notificationOccurred(kind);
      else tg.HapticFeedback.impactOccurred(kind || "light");
    } catch (e) {}
  }
  function hapticSuccess() { haptic("notification", "success"); }
  function hapticWarning() { haptic("notification", "warning"); }
  function hapticError() { haptic("notification", "error"); }
  function hapticTap() { haptic("impact", "light"); }
  function sendToTelegram(payload) {           // ready for future bot backend
    try { if (tg && tg.sendData) tg.sendData(JSON.stringify(payload)); return true; } catch (e) { return false; }
  }
  function closeMiniApp() { try { if (tg && tg.close) tg.close(); } catch (e) {} }
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

  /* ---------- state ---------- */
  var KEY = "yadavar.reminders.v1", TKEY = "yadavar.theme";
  var state = { reminders: [], filter: "all", editingId: null, snoozeId: null, deleteId: null };
  var fa = function (n) { return String(n).replace(/\d/g, function (d) { return "۰۱۲۳۴۵۶۷۸۹"[d]; }); };

  function loadData() {
    try {
      var raw = localStorage.getItem(KEY);
      var arr = raw ? JSON.parse(raw) : [];
      state.reminders = Array.isArray(arr) ? arr.filter(function (r) { return r && r.id && r.title; }) : [];
    } catch (e) { state.reminders = []; }
  }
  function saveData() {
    try { localStorage.setItem(KEY, JSON.stringify(state.reminders)); return true; }
    catch (e) { toast("ذخیره‌سازی ناموفق بود", "e"); return false; }
  }

  function uid() { return "r_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function tsOf(r) { var t = new Date(r.date + "T" + r.time).getTime(); return isNaN(t) ? Infinity : t; }

  /* ---------- CRUD ---------- */
  function createReminder(data) {
    var r = {
      id: uid(), title: data.title, description: data.description || "",
      date: data.date, time: data.time, repeat: data.repeat, priority: data.priority,
      status: "pending", createdAt: Date.now(), snoozedFrom: null
    };
    state.reminders.push(r); saveData(); return r;
  }
  function updateReminder(id, patch) {
    var r = findR(id); if (!r) return null;
    Object.keys(patch).forEach(function (k) { r[k] = patch[k]; });
    saveData(); return r;
  }
  function deleteReminder(id) {
    state.reminders = state.reminders.filter(function (r) { return r.id !== id; });
    saveData();
  }
  function completeReminder(id) {
    var r = findR(id); if (!r) return;
    if (r.status === "completed") { r.status = "pending"; toast("به حالت فعال برگشت", "i"); }
    else { r.status = "completed"; r.completedAt = Date.now(); toast("انجام شد ✅", "s"); hapticSuccess(); }
    saveData(); renderReminders(); updateStats();
  }
  function snoozeReminder(id, option) {
    var r = findR(id); if (!r) return;
    var base = new Date();
    if (option === "tomorrow") { base.setDate(base.getDate() + 1); }
    else { base = new Date(Date.now() + parseInt(option, 10) * 60000); }
    r.date = ymd(base); r.time = hm(base); r.status = "pending"; r.snoozedFrom = Date.now();
    saveData(); renderReminders(); updateStats();
    toast("به بعد موکول شد ⏰", "i"); hapticWarning();
  }
  function findR(id) { for (var i = 0; i < state.reminders.length; i++) if (state.reminders[i].id === id) return state.reminders[i]; return null; }

  function ymd(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function hm(d) { return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }

  function needsResponse(r) { return r.status === "pending" && tsOf(r) <= Date.now(); }
  function isToday(r) { return r.date === ymd(new Date()); }

  /* ---------- rendering ---------- */
  var REPEAT = { none: "بدون تکرار", daily: "هر روز", weekly: "هر هفته", monthly: "هر ماه", yearly: "هر سال" };
  var PRI = { normal: "عادی", high: "مهم", urgent: "خیلی مهم" };
  var listEl = document.getElementById("list");

  function faDate(s) {
    var p = String(s).split("-"); if (p.length !== 3) return s;
    try {
      return new Intl.DateTimeFormat("fa-IR", { year: "numeric", month: "long", day: "numeric" })
        .format(new Date(+p[0], +p[1] - 1, +p[2]));
    } catch (e) { return fa(s); }
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function visible() {
    var out = state.reminders.slice().sort(function (a, b) {
      if ((a.status === "completed") !== (b.status === "completed")) return a.status === "completed" ? 1 : -1;
      return tsOf(a) - tsOf(b);
    });
    if (state.filter === "today") out = out.filter(isToday);
    if (state.filter === "active") out = out.filter(function (r) { return r.status !== "completed"; });
    if (state.filter === "completed") out = out.filter(function (r) { return r.status === "completed"; });
    return out;
  }

  function renderReminders() {
    var items = visible();
    document.getElementById("count").textContent = items.length ? fa(items.length) + " مورد" : "";
    if (!items.length) {
      listEl.innerHTML = '<div class="glass empty"><div class="e">🗂️</div><p>هنوز یادآوری‌ای در این بخش نیست.<br/>با دکمه پایین اولین یادآوری‌ات را بساز.</p></div>';
      return;
    }
    listEl.innerHTML = items.map(function (r) {
      var attn = needsResponse(r);
      var acts = attn
        ? '<div class="acts"><button class="btn ok" data-act="done" data-id="' + r.id + '">✅ انجام شد</button>' +
          '<button class="btn" data-act="snooze" data-id="' + r.id + '">⏰ بعداً</button></div>'
        : '<div class="acts"><button class="btn ok" data-act="done" data-id="' + r.id + '">' +
          (r.status === "completed" ? "↩️ بازگردانی" : "✅ انجام شد") + '</button>' +
          '<button class="btn" data-act="edit" data-id="' + r.id + '">✏️ ویرایش</button>' +
          '<button class="btn danger" data-act="del" data-id="' + r.id + '">🗑 حذف</button></div>';
      return '<article class="glass card ' + (attn ? "attention " : "") + (r.status === "completed" ? "done" : "") + '">' +
        (attn ? '<div class="attn-bar">⚠️ نیازمند پاسخ شما</div>' : "") +
        '<div class="top"><h4>' + esc(r.title) + '</h4><span class="pri ' + r.priority + '">' + PRI[r.priority] + '</span></div>' +
        (r.description ? '<p class="desc">' + esc(r.description) + '</p>' : "") +
        '<div class="meta">' +
          '<span class="tag">📅 ' + faDate(r.date) + '</span>' +
          '<span class="tag">🕒 ' + fa(r.time) + '</span>' +
          '<span class="tag">🔁 ' + REPEAT[r.repeat] + '</span>' +
          '<span class="tag">' + (r.status === "completed" ? "✅ انجام‌شده" : attn ? "⚠️ سررسید" : "⏳ در انتظار") + '</span>' +
        '</div>' + acts + '</article>';
    }).join("");
  }

  function updateStats() {
    var today = 0, pending = 0, done = 0;
    state.reminders.forEach(function (r) {
      if (r.status === "completed") done++; else pending++;
      if (isToday(r) && r.status !== "completed") today++;
    });
    document.getElementById("sToday").textContent = fa(today);
    document.getElementById("sPending").textContent = fa(pending);
    document.getElementById("sDone").textContent = fa(done);
    document.getElementById("heroSub").textContent = pending
      ? "امروز " + fa(today) + " یادآوری و در مجموع " + fa(pending) + " مورد فعال داری."
      : "همه‌چیز مرتب است؛ یادآوری فعالی نداری. 🎉";
  }

  /* ---------- UI plumbing ---------- */
  var ov = document.getElementById("ov"), sheet = document.getElementById("sheet"),
      snoozeSheet = document.getElementById("snoozeSheet"), confirmSheet = document.getElementById("confirmSheet");
  function openSheet(el) { ov.classList.add("on"); el.classList.add("on"); }
  function closeSheets() { ov.classList.remove("on"); [sheet, snoozeSheet, confirmSheet].forEach(function (s) { s.classList.remove("on"); }); }
  ov.addEventListener("click", closeSheets);

  var toastEl = document.getElementById("toast"), toastT;
  function toast(msg, kind) {
    toastEl.textContent = msg; toastEl.className = "toast on " + (kind || "i");
    clearTimeout(toastT); toastT = setTimeout(function () { toastEl.classList.remove("on"); }, 2200);
  }

  /* theme */
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    document.getElementById("themeBtn").textContent = t === "dark" ? "🌙" : "☀️";
    try { localStorage.setItem(TKEY, t); } catch (e) {}
  }
  var savedTheme = "dark";
  try { savedTheme = localStorage.getItem(TKEY) || "dark"; } catch (e) {}
  applyTheme(savedTheme);
  document.getElementById("themeBtn").addEventListener("click", function () {
    applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"); hapticTap();
  });
  document.getElementById("settingsBtn").addEventListener("click", function () {
    hapticTap();
    toast("نسخه ۱.۰ — داده‌ها روی همین دستگاه ذخیره می‌شود", "i");
  });

  /* filters */
  document.getElementById("filters").addEventListener("click", function (e) {
    var b = e.target.closest(".chip"); if (!b) return;
    state.filter = b.dataset.f;
    [].forEach.call(this.querySelectorAll(".chip"), function (c) { c.classList.toggle("on", c === b); });
    hapticTap(); renderReminders();
  });

  /* form */
  var F = {
    title: document.getElementById("title"), desc: document.getElementById("desc"),
    date: document.getElementById("date"), time: document.getElementById("time"),
    repeat: document.getElementById("repeat"), priority: document.getElementById("priority")
  };
  function clearErrors() { ["eTitle", "eDate", "eTime", "ePast"].forEach(function (i) { document.getElementById(i).classList.remove("on"); }); }

  function openForm(r) {
    clearErrors();
    state.editingId = r ? r.id : null;
    document.getElementById("sheetTitle").textContent = r ? "ویرایش یادآوری" : "یادآوری جدید";
    var now = new Date();
    F.title.value = r ? r.title : "";
    F.desc.value = r ? r.description : "";
    F.date.value = r ? r.date : ymd(now);
    F.time.value = r ? r.time : hm(new Date(Date.now() + 3600000));
    F.repeat.value = r ? r.repeat : "none";
    F.priority.value = r ? r.priority : "normal";
    openSheet(sheet);
  }
  document.getElementById("fab").addEventListener("click", function () { hapticTap(); openForm(null); });
  document.getElementById("cancelBtn").addEventListener("click", closeSheets);

  document.getElementById("form").addEventListener("submit", function (e) {
    e.preventDefault(); clearErrors();
    var title = F.title.value.trim(), ok = true;
    if (title.length < 2) { document.getElementById("eTitle").classList.add("on"); ok = false; }
    if (!F.date.value || isNaN(new Date(F.date.value).getTime())) { document.getElementById("eDate").classList.add("on"); ok = false; }
    if (!/^\d{2}:\d{2}$/.test(F.time.value)) { document.getElementById("eTime").classList.add("on"); ok = false; }
    if (ok) {
      var t = new Date(F.date.value + "T" + F.time.value).getTime();
      if (isNaN(t)) { document.getElementById("eDate").classList.add("on"); ok = false; }
      else if (!state.editingId && t < Date.now() - 60000) { document.getElementById("ePast").classList.add("on"); ok = false; }
    }
    if (!ok) { hapticError(); toast("لطفاً فیلدها را بررسی کنید", "e"); return; }

    var payload = {
      title: title, description: F.desc.value.trim(), date: F.date.value,
      time: F.time.value, repeat: F.repeat.value, priority: F.priority.value
    };
    if (state.editingId) { updateReminder(state.editingId, payload); toast("ویرایش ذخیره شد", "s"); }
    else { createReminder(payload); toast("یادآوری ثبت شد", "s"); }
    hapticSuccess(); closeSheets(); renderReminders(); updateStats();
  });

  /* card actions */
  listEl.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-act]"); if (!b) return;
    var id = b.dataset.id;
    if (b.dataset.act === "done") completeReminder(id);
    else if (b.dataset.act === "edit") { hapticTap(); openForm(findR(id)); }
    else if (b.dataset.act === "snooze") { state.snoozeId = id; hapticTap(); openSheet(snoozeSheet); }
    else if (b.dataset.act === "del") {
      state.deleteId = id;
      var r = findR(id);
      document.getElementById("confirmText").textContent = "«" + (r ? r.title : "") + "» برای همیشه حذف می‌شود. مطمئنی؟";
      hapticWarning(); openSheet(confirmSheet);
    }
  });

  snoozeSheet.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-sn]"); if (!b) return;
    snoozeReminder(state.snoozeId, b.dataset.sn); state.snoozeId = null; closeSheets();
  });
  document.getElementById("snCancel").addEventListener("click", closeSheets);
  document.getElementById("cfNo").addEventListener("click", closeSheets);
  document.getElementById("cfYes").addEventListener("click", function () {
    if (state.deleteId) { deleteReminder(state.deleteId); state.deleteId = null; renderReminders(); updateStats(); toast("حذف شد", "s"); hapticSuccess(); }
    closeSheets();
  });

  /* greeting */
  function greet() {
    var name = "دوست عزیز";
    try { if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) name = tg.initDataUnsafe.user.first_name; } catch (e) {}
    var h = new Date().getHours(), part = h < 12 ? "صبح بخیر" : h < 18 ? "ظهر بخیر" : "شب بخیر";
    document.getElementById("hello").textContent = part + "، " + name + " 👋";
  }

  /* boot + live refresh for due items */
  loadData(); greet(); renderReminders(); updateStats();
  setInterval(function () { renderReminders(); updateStats(); }, 30000);

  window.Yadavar = {
    state: state, createReminder: createReminder, updateReminder: updateReminder,
    deleteReminder: deleteReminder, completeReminder: completeReminder, snoozeReminder: snoozeReminder,
    renderReminders: renderReminders, updateStats: updateStats, saveData: saveData, loadData: loadData,
    sendToTelegram: sendToTelegram, closeMiniApp: closeMiniApp,
    hapticSuccess: hapticSuccess, hapticWarning: hapticWarning, hapticError: hapticError
  };
})();
</script>
</body>
</html>
